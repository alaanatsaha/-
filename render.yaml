services:
  - type: web
    name: pib-credit-assessment-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: pib-credit-assessment-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://pib-credit-assessment-web.onrender.com
      - key: ALLOWED_HOSTS
        value: pib-credit-assessment-api.onrender.com

  - type: web
    name: pib-credit-assessment-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build -- --base=/
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pib-credit-assessment-api.onrender.com

databases:
  - name: pib-credit-assessment-db
    databaseName: pib_assessment
    user: pib_assessment
    plan: free
